  --wall:#f0a0ab; --wall2:#f0a0ab; --body:#fbf6f3; --trim:#e9dfe6;
  --blue:#3b4fa8; --blue2:#6a7fd6; --text:#4a2f45;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --wall:#c8798b; --wall2:#a85d70; --body:#f3ece9; --trim:#d9cdd6; --text:#4a2f45; }
}
:root:not([data-theme="light"]){ color-scheme:light; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--wall);overscroll-behavior:none}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;
  background:var(--wall);
  color:var(--text); display:flex; justify-content:center; padding:16px; min-height:100dvh;
}
.cab{width:min(100%,760px);display:flex;flex-direction:column}
/* marquee */
.marquee{
  background:linear-gradient(135deg,#7f93e8,#c7a6ec 55%,#ffb7d0);
  border-radius:22px 22px 0 0;padding:10px 18px;border:3px solid #fff;border-bottom:0;
  display:flex;justify-content:space-between;align-items:center;color:#fff;
  text-shadow:0 2px 0 rgba(59,79,168,.55);font-weight:900;font-size:clamp(18px,4vw,28px);letter-spacing:.04em
}
.marquee small{font-size:.5em;font-weight:700;text-shadow:none;opacity:.95}
/* screen */
.bezel{
  background:#16121a;border:3px solid #fff;padding:14px;
  box-shadow:inset 0 0 0 3px #2b2433, inset 0 8px 24px rgba(0,0,0,.7)
}
.screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.screen iframe,.screen .idle{position:absolute;inset:0;width:100%;height:100%;border:0}
.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:repeating-linear-gradient(45deg,#2a2140 0 14px,#31274a 14px 28px);color:#e8dcff;text-align:center;padding:12px}
.idle b{font-size:clamp(16px,3.4vw,24px)}
.idle span{font-size:clamp(11px,2vw,14px);opacity:.8}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.12) 0,rgba(255,255,255,0) 35%)}
/* url bar */
.load{display:flex;gap:8px;background:var(--trim);padding:8px 12px;border:3px solid #fff;border-top:0;border-bottom:0}
.load input{flex:1;min-width:0;border:2px solid #fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:16px;color:var(--text);background:#fff;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.load button,.load a{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:800;font-size:14px;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.load a{background:#ff7aa8}
/* control deck */
.deck{
  position:relative;background:linear-gradient(#fff,var(--body) 40%,#efe4e6);
  border:3px solid #fff;border-radius:0 0 26px 26px;padding:22px 14px 26px;
  box-shadow:0 18px 30px rgba(120,40,70,.35);overflow:hidden
}
.deck::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
   radial-gradient(circle at 12% 20%,#ffd6e4 0 3px,transparent 4px),
   radial-gradient(circle at 88% 30%,#cfd8ff 0 3px,transparent 4px),
   radial-gradient(circle at 70% 85%,#ffe9a8 0 3px,transparent 4px),
   radial-gradient(circle at 25% 80%,#d9c6ff 0 3px,transparent 4px)}
.panel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;position:relative}
.cluster{position:relative;height:clamp(150px,30vw,230px);
  background:linear-gradient(#f4eefb,#e3d8f3);border-radius:28px;border:3px solid #fff;
  box-shadow:inset 0 3px 8px rgba(110,80,160,.25),0 2px 0 #cdbfe3}
.center{display:flex;flex-direction:column;align-items:center;gap:10px}
.speaker{width:clamp(70px,14vw,120px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#8b94d6 0 2px,transparent 3px) 0 0/10px 10px,linear-gradient(#b9c2f2,#8e9be0);
  border:3px solid #fff;box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.slot{width:clamp(70px,14vw,120px);height:16px;border-radius:8px;background:#2a2233;box-shadow:inset 0 3px 4px #000,0 1px 0 #fff}
/* buttons */
.btn{position:absolute;width:clamp(64px,13vw,98px);aspect-ratio:1;border-radius:50%;
  background:var(--rim);padding:0;border:0;
  box-shadow:0 7px 0 var(--base),0 12px 14px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.8);
  transition:transform .05s,box-shadow .05s}
.btn i{position:absolute;inset:9%;border-radius:50%;display:block;
  background:radial-gradient(circle at 36% 28%,#fff 0 6%,var(--hi) 7% 30%,var(--mid) 62%,var(--lo) 100%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),0 0 18px var(--glow);
  transition:box-shadow .05s,filter .05s}
.btn.on{transform:translateY(6px);box-shadow:0 1px 0 var(--base),0 4px 6px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.6)}
.btn.on i{filter:brightness(1.2) saturate(1.1);box-shadow:inset 0 -2px 6px rgba(0,0,0,.12),0 0 46px 10px var(--glow),0 0 90px 20px var(--glow)}
.red{--rim:#ffe1e6;--base:#c9899a;--hi:#ff9fb4;--mid:#ff4f76;--lo:#d92b55;--glow:rgba(255,60,110,.75)}
.green{--rim:#e3f7e3;--base:#7fb47f;--hi:#a6f5a6;--mid:#3fd45a;--lo:#1fa63a;--glow:rgba(60,230,90,.75)}
.yellow{--rim:#fff4cc;--base:#c9ac4a;--hi:#fff08a;--mid:#ffcf1f;--lo:#e09a00;--glow:rgba(255,210,30,.8)}
/* triangle layout inside each cluster */
.c1{left:9%;top:8%}  .c2{left:50%;top:8%;} .c3{left:29%;top:50%}
.cluster .btn.a{left:8%;top:10%}
.cluster .btn.b{right:8%;top:10%}
.cluster .btn.c{left:50%;margin-left:calc(clamp(64px,13vw,98px) / -2);bottom:8%}
.hint{text-align:center;font-size:12px;margin-top:14px;color:#8a6a85;position:relative}
.modes{display:flex;justify-content:center;gap:8px;margin:0 0 16px;position:relative}
.modes button{border:2px solid #fff;border-radius:999px;padding:7px 16px;font:inherit;font-weight:800;font-size:13px;background:#e3d8f3;color:var(--text);cursor:pointer;touch-action:manipulation}
.modes button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pad{display:none;position:relative;max-width:560px;margin:0 auto}
.deck[data-mode="3ds"] .panel{display:none}
.deck[data-mode="3ds"] .pad{display:block}
.pad svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(120,40,70,.35))}
.pad .pz{cursor:pointer;transition:transform .05s,filter .05s}
.pad .pz.on{transform:translateY(5px)}
.pad .hl{fill:#fff;stroke:none;opacity:0;pointer-events:none;transition:opacity .05s}
.pad .pz.on .hl{opacity:.4}
.k-3ds{display:none}
.deck[data-mode="3ds"] .k-3ds{display:block}
.deck[data-mode="3ds"] .k-arcade{display:none}
/* machine look: flat colours, striped marquee, song-select screen */
.marquee{background:repeating-linear-gradient(90deg,#fff 0 14px,#dde4f6 14px 28px);color:#e0245e;justify-content:center;gap:14px;position:relative;overflow:hidden;text-shadow:-2px 0 #fff,2px 0 #fff,0 -2px #fff,0 2px #fff,0 3px 0 #b0173f}
.marquee small{background:#3b4fa8;color:#fff;padding:.25em .8em;border-radius:4px;text-shadow:none;opacity:1}
.marquee::before,.marquee::after{content:"\2605";position:absolute;top:50%;transform:translateY(-50%);font-size:1.7em;text-shadow:none}
.marquee::before{left:14px;color:#c9a64a}.marquee::after{right:14px;color:#4a5fb8}
.deck{background:#fbf6f3}.deck::before,.glare{display:none}
.cluster{background:#e6dcf5}
.screen{container-type:inline-size}
.menu{position:absolute;inset:0;background:#f2b95e;overflow:hidden;font-weight:800;color:#6a3f9a}
.menu::before{content:"";position:absolute;left:0;right:0;top:25cqw;height:24cqw;background:#fbe9c8}
.m-title{position:absolute;left:3cqw;top:3cqw;font-size:3cqw;padding:.8cqw 4cqw;background:#fff;border:.5cqw solid #b79ae0;border-radius:4cqw}
.m-count{position:absolute;right:3cqw;top:2.5cqw;width:11cqw;aspect-ratio:1;border-radius:50%;background:#cfd3e6;border:.6cqw solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:2cqw}
.m-count b{font-size:4cqw}
.m-name{position:absolute;left:50%;top:13cqw;transform:translateX(-50%);max-width:74cqw;display:flex;align-items:center;gap:1.5cqw;font-size:4.4cqw;color:#7a2f86;background:#fff;border:.5cqw solid #9d6fd0;padding:.8cqw 3cqw;border-radius:1.4cqw;white-space:nowrap}
.m-name span{overflow:hidden;text-overflow:ellipsis}
.m-diff{font-style:normal;font-size:2.2cqw;color:#fff;padding:.4cqw 1.6cqw;border-radius:3cqw;background:#e0245e}
.m-diff.medium{background:#e0a400}
.m-row{position:absolute;left:0;right:0;top:28cqw;height:20cqw;display:flex;align-items:center;justify-content:center;gap:2.2cqw}
.it{width:14cqw;height:14cqw;border:.7cqw solid #7c5cc4;border-radius:1.2cqw;position:relative;overflow:hidden;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:4cqw}
.it img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it.sel{width:18cqw;height:18cqw;border-color:#fff;box-shadow:0 0 0 .8cqw #8a63d8;transform:translateY(-1cqw)}
.m-arrow{position:absolute;top:35cqw;width:0;height:0;border-top:2.4cqw solid transparent;border-bottom:2.4cqw solid transparent;cursor:pointer}
.m-arrow.l{left:2.5cqw;border-right:3.6cqw solid #3fd45a}.m-arrow.r{right:2.5cqw;border-left:3.6cqw solid #ffcf1f}
.m-bar{position:absolute;left:0;right:0;bottom:0;height:8cqw;background:#6b3fa0;color:#fff;font-size:3cqw;display:flex;align-items:center;justify-content:center;gap:1.2cqw}
.dot{width:4.5cqw;height:4.5cqw;border-radius:50%;border:.5cqw solid #fff;display:inline-block}
.dot.g{background:#3fd45a}.dot.y{background:#ffcf1f}.dot.r{background:#ff4f76}
/* volume: its own strip at the bottom of the deck, away from the pads */
.btn,.pz,.pad,.pad svg{touch-action:none}
/* volume: small and quiet, five indicator lamps */
.vol{display:flex;align-items:center;justify-content:center;gap:4px;margin:20px auto 0;position:relative}
#muteBtn{flex:none;width:40px;height:40px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
#muteBtn svg{width:18px;height:18px;fill:#b7a3d9;stroke:#b7a3d9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#muteBtn .x{display:none}
#muteBtn[aria-pressed="true"] .w{display:none}
#muteBtn[aria-pressed="true"] .x{display:inline}
.vol output{display:none}
.vol .bars{display:flex;align-items:center;height:40px;touch-action:none;cursor:pointer}
.vol .bars button{width:30px;height:40px;padding:0;margin:0;border:0;background:none;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.vol .bars i{display:block;width:9px;height:9px;border-radius:50%;border:2px solid #cdbfe3;background:transparent}
.vol .bars button.on i{background:#a58bd6;border-color:#a58bd6}
.marquee{cursor:pointer}
/* laptop / landscape: video on the left, controls on the right */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  body{min-height:100dvh;align-items:center;padding:20px 28px}
  .cab{width:min(100%,1400px);display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);grid-template-areas:"m d" "b d" "l d";grid-template-rows:auto 1fr auto;column-gap:18px}
  .marquee{grid-area:m}
  .bezel{grid-area:b;display:flex;align-items:center;justify-content:center}
  .load{grid-area:l;border-bottom:3px solid #fff;border-radius:0 0 22px 22px}
  .deck{grid-area:d;border-radius:26px;display:flex;flex-direction:column;justify-content:center;padding:22px 16px 26px}
  .screen{width:min(100%,calc((100dvh - 210px) * 16 / 9));margin:0 auto}
  .pad{max-width:100%;width:100%}
  .panel{grid-template-columns:1fr 1fr}
  .center{display:none}
  .cluster{height:clamp(150px,19vw,210px)}
  .btn{width:clamp(52px,5.5vw,76px)}
  .cluster .btn.c{margin-left:calc(clamp(52px,5.5vw,76px) / -2)}
}
</style>
</head>
<body>
<main class="cab">
  <div class="marquee"><span>アイカツ!</span><small>アイドルカードゲーム</small></div>

  <div class="bezel">
    <div class="screen" id="screen">
      <div class="menu" id="menu">
        <div class="m-title">ステージを選んでね</div>
        <div class="m-count" id="mCount"></div>
        <div class="m-name"><span id="mName"></span><i class="m-diff" id="mDiff"></i></div>
        <div class="m-arrow l" id="mPrev"></div><div class="m-arrow r" id="mNext"></div>
        <div class="m-row" id="mRow"></div>
        <div class="m-bar"><i class="dot g"></i><i class="dot y"></i>でえらんで<i class="dot r"></i>で決定だよ！</div>
      </div>
      <div class="glare"></div>
    </div>
  </div>

  <form class="load" id="loadForm">
    <button type="button" id="listBtn" style="background:#8a63d8">Songs</button>
    <input id="url" type="text" inputmode="url" placeholder="Or paste your own YouTube link" aria-label="YouTube link">
    <button type="submit">Play</button>
    <a id="ytOpen" href="#" target="_blank" rel="noopener" hidden style="background:#8a6a85">Open on YouTube</a>
    <a id="search" href="https://www.youtube.com/results?search_query=%E3%82%A2%E3%82%A4%E3%82%AB%E3%83%84!+%E3%83%87%E3%83%BC%E3%82%BF%E3%82%AB%E3%83%BC%E3%83%89%E3%83%80%E3%82%B9+%E3%83%97%E3%83%AC%E3%82%A4%E5%8B%95%E7%94%BB+%E7%AD%90%E4%BD%93" target="_blank" rel="noopener">Find videos</a>
  </form>

  <section class="deck" id="deck" data-mode="3ds" aria-label="Control deck">
    <div class="modes"><button type="button" data-m="arcade" aria-pressed="false">Arcade buttons</button><button type="button" data-m="3ds" aria-pressed="true">3DS pad</button></div>
    <div class="panel">
      <div class="cluster" data-side="L">
        <button class="btn red a"><i></i></button>
        <button class="btn green b"><i></i></button>
        <button class="btn yellow c"><i></i></button>
      </div>
      <div class="center"><div class="speaker"></div><div class="slot"></div></div>
      <div class="cluster" data-side="R">
        <button class="btn red a"><i></i></button>
        <button class="btn green b"><i></i></button>
        <button class="btn yellow c"><i></i></button>
      </div>
    </div>
    <div class="pad">
      <svg viewBox="0 0 400 240" role="group" aria-label="Three-panel pad">
        <defs>
          <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ab8"/><stop offset="1" stop-color="#e0307f"/></linearGradient>
          <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fe07a"/><stop offset="1" stop-color="#17983f"/></linearGradient>
          <linearGradient id="gy" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23a"/><stop offset="1" stop-color="#f08400"/></linearGradient>
        </defs>
        <g class="pz" data-n="0"><polygon points="2,2 398,2 398,52 200,120 2,52" fill="url(#gp)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><polygon points="200,14 248,64 222,64 222,100 178,100 178,64 152,64" fill="#ff9ed2" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>
        <g class="pz" data-n="1"><polygon points="2,54 198,122 198,238 2,238" fill="url(#gg)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><polygon points="52,176 104,136 104,160 146,160 146,192 104,192 104,216" fill="#8cf0a8" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>
        <g class="pz" data-n="2"><polygon points="398,54 202,122 202,238 398,238" fill="url(#gy)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><polygon points="348,176 296,136 296,160 254,160 254,192 296,192 296,216" fill="#ffb347" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>
      </svg>
    </div>
    <div class="hint k-arcade">Keys: red A / J, green D / K, yellow S / L</div>
    <div class="hint k-3ds">Keys: ↑ pink, ← green, → yellow</div>
    <div class="hint">Back to song select: press Esc or M, or tap the logo at the top</div>
    <div class="vol"><button type="button" id="muteBtn" aria-label="Mute sound effects" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><g class="w" fill="none"><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></g><g class="x" fill="none"><path d="M16 9l5 6M21 9l-5 6"/></g></svg></button><div class="bars" id="volBars" role="group" aria-label="Sound effects volume"><button type="button" data-n="1" aria-label="Volume 1 of 5"><i></i></button><button type="button" data-n="2" aria-label="Volume 2 of 5"><i></i></button><button type="button" data-n="3" aria-label="Volume 3 of 5"><i></i></button><button type="button" data-n="4" aria-label="Volume 4 of 5"><i></i></button><button type="button" data-n="5" aria-label="Volume 5 of 5"><i></i></button></div><output id="volOut">100%</output></div>
  </section>
</main>

<script>
(function(){
  var ctx=null,nbuf=null;
  // volume (remembered between visits)
  var vol=1,muted=false;
  try{var sv=localStorage.getItem("aik_vol");if(sv!==null&&!isNaN(+sv))vol=Math.max(.2,Math.min(1,Math.round(+sv/20)/5));muted=localStorage.getItem("aik_mute")==="1"}catch(e){}
  function level(){return muted?0:Math.pow(vol,1.5)}
  function click(freq){
    if(level()<=0)return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==="suspended")ctx.resume();
      var t=ctx.currentTime, k=.92+(freq%97)/600;
      if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      var out=ctx.createGain();out.gain.value=.5*level();out.connect(ctx.destination);
      // 1. noise wash: the long shimmering tail of a cymbal
      var n=ctx.createBufferSource();n.buffer=nbuf;
      var hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=5500*k;
      var bp=ctx.createBiquadFilter();bp.type="peaking";bp.frequency.value=9500*k;bp.gain.value=8;bp.Q.value=.8;
      var ng=ctx.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.55,t+.003);
      ng.gain.exponentialRampToValueAtTime(.18,t+.06);ng.gain.exponentialRampToValueAtTime(.001,t+.75);
      n.connect(hp);hp.connect(bp);bp.connect(ng);ng.connect(out);n.start(t);n.stop(t+.8);
      // 2. metallic partials: inharmonic squares give the clang
      var mg=ctx.createGain();mg.gain.setValueAtTime(.0001,t);mg.gain.linearRampToValueAtTime(.16,t+.002);
      mg.gain.exponentialRampToValueAtTime(.001,t+.35);
      var mh=ctx.createBiquadFilter();mh.type="highpass";mh.frequency.value=6500;
      mg.connect(mh);mh.connect(out);
      [205.3,304.4,369.6,522.7,540,800].forEach(function(f){
        var o=ctx.createOscillator();o.type="square";o.frequency.value=f*k*1.6;o.connect(mg);o.start(t);o.stop(t+.4);
      });
      // 3. stick tap at the start
      var tg=ctx.createGain();tg.gain.setValueAtTime(.35,t);tg.gain.exponentialRampToValueAtTime(.001,t+.02);
      var to=ctx.createOscillator();to.type="triangle";to.frequency.setValueAtTime(1800*k,t);to.frequency.exponentialRampToValueAtTime(400,t+.02);
      to.connect(tg);tg.connect(out);to.start(t);to.stop(t+.03);
    }catch(e){}
  }
  var pitch={red:520,green:620,yellow:720};
  document.querySelectorAll(".btn").forEach(function(b){
    var col=b.classList.contains("red")?"red":b.classList.contains("green")?"green":"yellow";
    function down(e){e.preventDefault();b.classList.add("on");click(pitch[col]);try{b.setPointerCapture(e.pointerId)}catch(_){}
      try{if(navigator.vibrate)navigator.vibrate(8)}catch(_){}}
    function up(e){b.classList.remove("on")}
    b.addEventListener("pointerdown",down);
    b.addEventListener("pointerup",up);
    b.addEventListener("pointercancel",up);
    b.addEventListener("lostpointercapture",up);
    b.addEventListener("contextmenu",function(e){e.preventDefault()});
  });
  // keyboard: A S D  /  J K L
  var map={a:0,d:1,s:2,j:3,k:4,l:5};
  var all=document.querySelectorAll(".btn");

  });
  var pz=document.querySelectorAll(".pz"),kmap={arrowup:0,arrowleft:1,arrowright:2};
  pz.forEach(function(z){var p=z.querySelector("polygon"),h=p.cloneNode(false);h.setAttribute("class","hl");h.removeAttribute("fill");h.removeAttribute("stroke");z.insertBefore(h,p.nextSibling)});

    b.addEventListener("click",function(){
      document.getElementById("deck").dataset.mode=b.dataset.m;b.blur();window.focus();
      document.querySelectorAll(".modes button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
    });
  });

  // long press: silent while held, a cymbal hit when you let go
  var holds={},LONG_MS=150;
  function holdStart(id){
    var f=520;for(var i=0;i<id.length;i++)f+=id.charCodeAt(i);
    holds[id]={t:Date.now(),f:f};
  }
  function holdEnd(id){
    var h=holds[id];if(!h)return;
    delete holds[id];
    if(Date.now()-h.t>=LONG_MS)click(h.f);
  }
  function releaseAll(){holds={}}
  document.querySelectorAll(".btn").forEach(function(b,i){
    var id="b"+i;
    b.addEventListener("pointerdown",function(){holdStart(id)});
    ["pointerup","pointercancel","lostpointercapture"].forEach(function(t){b.addEventListener(t,function(){holdEnd(id)})});
  });
  document.querySelectorAll(".pz").forEach(function(z){
    var id="p"+z.dataset.n;
    z.addEventListener("pointerdown",function(){holdStart(id)});
    ["pointerup","pointercancel","lostpointercapture"].forEach(function(t){z.addEventListener(t,function(){holdEnd(id)})});
  });
  addEventListener("keydown",function(e){
    var k=e.key.toLowerCase();
    if(e.repeat||e.target.tagName==="INPUT")return;
    if(map[k]!==undefined||kmap[k]!==undefined)holdStart("k"+k);
  });
  addEventListener("keyup",function(e){holdEnd("k"+e.key.toLowerCase())});
  addEventListener("blur",releaseAll);
  document.addEventListener("visibilitychange",function(){if(document.hidden)releaseAll()});

   // song menu

  ];
  var tints=["#7c5cc4","#d86a9a","#4aa3d8","#e8a23a","#5fbf7a"];
  var scr=document.getElementById("screen"),menu=document.getElementById("menu"),row=document.getElementById("mRow");
  var cur=0,menuOn=true,yt=document.getElementById("ytOpen");
  function renderMenu(){
    var n=SONGS.length,h="";
    for(var o=-2;o<=2;o++){
      var i=(cur+o+n)%n;
      h+='<div class="it'+(o?'':' sel')+'" data-i="'+i+'" style="background:'+tints[i%5]+'"><b>'+('0'+(i+1)).slice(-2)+'</b><img src="https://img.youtube.com/vi/'+SONGS[i].id+'/mqdefault.jpg" alt=""></div>';
    }
    row.innerHTML=h;
    row.querySelectorAll("img").forEach(function(m){m.addEventListener("error",function(){m.remove()})});
    document.getElementById("mName").textContent=SONGS[cur].t;
    var d=document.getElementById("mDiff");d.textContent=SONGS[cur].d.toUpperCase();d.className="m-diff "+SONGS[cur].d;
    document.getElementById("mCount").innerHTML="<span>きょく</span><b>"+(cur+1)+"</b><span>/ "+n+"</span>";
  }
  function loadVid(id,st){
    var old=scr.querySelector("iframe");if(old)old.remove();
    var f=document.createElement("iframe");
    f.src="https://www.youtube.com/embed/"+id+"?playsinline=1&rel=0&modestbranding=1&autoplay=1"+(st?"&start="+st:"");
    f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;
    scr.insertBefore(f,menu);menu.style.display="none";menuOn=false;
    yt.href="https://www.youtube.com/watch?v="+id+(st?"&t="+st+"s":"");yt.hidden=false;
  }
  function showMenu(){
    var old=scr.querySelector("iframe");if(old)old.remove();
    menu.style.display="block";menuOn=true;yt.hidden=true;renderMenu();
  }
  function nav(a){
    if(!menuOn)return;
    var n=SONGS.length;
    if(a==="prev"){cur=(cur+n-1)%n;renderMenu()}
    else if(a==="next"){cur=(cur+1)%n;renderMenu()}
    else loadVid(SONGS[cur].id,SONGS[cur].s);
  }
  row.addEventListener("click",function(e){
    var t=e.target.closest(".it");if(!t)return;
    var i=+t.dataset.i;if(i===cur)nav("ok");else{cur=i;renderMenu()}
  });
  document.getElementById("mPrev").addEventListener("click",function(){nav("prev")});
  document.getElementById("mNext").addEventListener("click",function(){nav("next")});
  // red = pick, green = left, yellow = right (same on the pad, arcade buttons and keyboard)
  var acts=["ok","prev","next"];
  document.querySelectorAll(".btn").forEach(function(b,i){b.addEventListener("pointerdown",function(){nav(acts[i%3])})});
  document.querySelectorAll(".pz").forEach(function(z){z.addEventListener("pointerdown",function(){nav(acts[+z.dataset.n])})});
  var kn={a:"ok",d:"prev",s:"next",j:"ok",k:"prev",l:"next",arrowup:"ok",arrowleft:"prev",arrowright:"next",enter:"ok"};
  addEventListener("keydown",function(e){
    if(e.repeat||e.target.tagName==="INPUT")return;
    var a=kn[e.key.toLowerCase()];if(a)nav(a);
  });

  // custom YouTube link
  function vid(u){var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null}
  var urlIn=document.getElementById("url");
  document.getElementById("loadForm").addEventListener("submit",function(e){
    e.preventDefault();
    var u=urlIn.value.trim(),id=vid(u);
    if(!id){urlIn.value="";urlIn.placeholder="That isn't a YouTube link, try again";return}
    var m=u.match(/[?&](?:t|start)=(\d+)/);loadVid(id,m?+m[1]:0);
  });
  // volume controls: five bars, tap one or drag across them
  var vb=document.getElementById("volBars"),vo=document.getElementById("volOut"),vm=document.getElementById("muteBtn");
  var bars=vb.querySelectorAll("button");
  function saveVol(){try{localStorage.setItem("aik_vol",Math.round(vol*100));localStorage.setItem("aik_mute",muted?"1":"0")}catch(e){}}
  function paintVol(){
    var n=Math.round(vol*5);
    bars.forEach(function(b,i){b.classList.toggle("on",!muted&&i<n)});
    vo.textContent=muted?"Muted":n*20+"%";
    vm.setAttribute("aria-pressed",muted?"true":"false");
  }
  function setBar(n){vol=n/5;muted=false;saveVol();paintVol()}
  function barFromX(x){
    var r=vb.getBoundingClientRect();
    return Math.max(1,Math.min(5,Math.ceil((x-r.left)/r.width*5)));
  }
  var dragging=false,lastN=0;
  vb.addEventListener("pointerdown",function(e){
    e.preventDefault();dragging=true;
    try{vb.setPointerCapture(e.pointerId)}catch(_){}
    lastN=barFromX(e.clientX);setBar(lastN);
  });
  vb.addEventListener("pointermove",function(e){
    if(!dragging)return;
    var n=barFromX(e.clientX);if(n!==lastN){lastN=n;setBar(n)}
  });
  function endVol(){if(!dragging)return;dragging=false;click(620)}
  ["pointerup","pointercancel"].forEach(function(t){vb.addEventListener(t,endVol)});
  bars.forEach(function(b){b.addEventListener("click",function(e){if(e.detail===0){setBar(+b.dataset.n);click(620)}})});
  vm.addEventListener("click",function(){
    muted=!muted;saveVol();paintVol();if(!muted)click(620);vm.blur();
  });
  paintVol();

  // stop double-tap / pinch zoom (iOS Safari ignores user-scalable=no)
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
  document.addEventListener("dblclick",function(e){if(e.target.tagName!=="INPUT")e.preventDefault()});
  var lastTap=0;
  document.addEventListener("touchend",function(e){
    var now=Date.now();
    if(e.target.closest&&e.target.closest(".panel,.pad")&&now-lastTap<400)e.preventDefault();
    lastTap=now;
  },{passive:false});

  document.getElementById("listBtn").addEventListener("click",showMenu);
  // shortcuts back to the song menu: Esc / M, or tap the logo
  function backToMenu(){if(!menuOn)showMenu()}
  document.querySelector(".marquee").addEventListener("click",backToMenu);
  addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT")return;
    var k=e.key.toLowerCase();
    if(k==="escape"||k==="m")backToMenu();
  });
  renderMenu();
